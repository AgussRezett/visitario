name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://mjpzawlyjjlmluozjwap.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-PYMHAnKQvaJgir69lNNmw_GbIpkmK1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      VITE_SUPABASE_URL: https://mjpzawlyjjlmluozjwap.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-PYMHAnKQvaJgir69lNNmw_GbIpkmK1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
